<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17131b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lares">
<title>Lares</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  /* Lares 11b — the design N. picked in 11a (docs/DESIGN_11a.md): Hearth (the
     icon's plum, cream and amber), Night when the phone is in dark mode,
     compact, sans, Due first. No font or image from the network. */
  :root{
    --bg:#f5efe4; --surface:#fffdf9; --ink:#2a2130; --muted:#75697a; --line:#e6dccd;
    --accent:#4e3a5c; --on-accent:#f3ece0; --soft:#ece3ef; --flame:#e3a64a; --flame-soft:#f8ead2; --flame-ink:#8a5a12;
    --late:#b3402e; --late-soft:#f6e1dc; --ok:#3f7a55; --icon:#4e3a5c;
    --shadow:0 1px 2px rgba(42,33,48,.06),0 4px 14px rgba(42,33,48,.06);
    --pad:12px; --gap:8px; --row:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17131b; --surface:#221c28; --ink:#f1eaf3; --muted:#a99db0; --line:#332a3a;
      --accent:#e3a64a; --on-accent:#221c28; --soft:#2e2536; --flame-soft:#3a2f22; --flame-ink:#e3a64a;
      --late:#f08b75; --late-soft:#3d2320; --ok:#8cc7a0; --icon:#e3a64a; --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;}
  input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .app{max-width:520px;margin:0 auto;padding-bottom:96px;}
  header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px var(--pad) 8px;}
  header h1{flex:1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink);}
  #more-btn{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);}
  main{padding:0 var(--pad);}
  .view{display:none;}
  body[data-view="due"] .v-due, body[data-view="spaces"] .v-spaces, body[data-view="space"] .v-space,
  body[data-view="thing"] .v-thing, body[data-view="art"] .v-art{display:block;}
  .sub{color:var(--muted);font-size:14px;margin:-2px 2px 10px;}
  h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 2px 6px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
  .row{display:flex;align-items:center;gap:10px;padding:var(--row) 12px;border-top:1px solid var(--line);width:100%;}
  .card > .row:first-child,.card > :first-child .row{border-top:0;}
  .row .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .thing,.due-what{font-size:15px;font-weight:600;word-break:break-word;}
  .row .s,.due-sub{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .chev{color:var(--muted);opacity:.6;flex:0 0 auto;}
  .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--icon);flex:0 0 auto;}
  .pill,.due-when{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted);}
  .pill::first-letter,.due-when::first-letter{text-transform:uppercase;}
  .pill.late,.due-when.late{background:var(--late-soft);color:var(--late);}
  .pill.now,.due-when.now{background:var(--flame-soft);color:var(--flame-ink);}
  .btn{height:34px;padding:0 13px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;background:var(--surface);flex:0 0 auto;}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .btn.danger{color:var(--late);}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;}
  /* Due */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:4px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);}
  .stat b{display:block;font-size:24px;line-height:1;}
  .stat span{font-size:12px;color:var(--muted);}
  .stat.late b{color:var(--late);}
  #due .card{margin-bottom:2px;}
  .due-row{cursor:pointer;}
  .due-row .main{gap:2px;}
  .due-row .due-when{align-self:flex-start;margin-top:4px;}
  /* Spaces */
  #search{width:100%;height:42px;margin-bottom:4px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:108px;}
  .tile-name{font-size:15px;font-weight:700;}
  .tile .meta{font-size:12px;color:var(--muted);margin-top:-4px;}
  .tile .foot{margin-top:auto;display:flex;gap:5px;flex-wrap:wrap;}
  #results:not(:empty){margin-bottom:10px;}
  /* a space's page */
  .space{display:none;}
  .space.on{display:block;}
  .hero{background:var(--accent);color:var(--on-accent);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:4px;}
  .hero .ico{background:rgba(255,255,255,.14);color:var(--flame);width:40px;height:40px;}
  @media (prefers-color-scheme: dark){ .hero .ico{background:rgba(0,0,0,.14);color:var(--on-accent);} }
  .space-name{font-size:19px;font-weight:700;display:block;}
  .hero .n{font-size:13px;opacity:.85;}
  .add-thing{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);}
  .add-thing input{flex:1;}
  .add-thing select{flex:0 0 auto;max-width:42%;}
  .actions{display:flex;gap:8px;margin:12px 0;}
  .actions .btn{flex:1;height:40px;text-align:center;}
  /* a thing's page */
  .edit{display:flex;flex-direction:column;gap:8px;}
  .edit [data-f="name"]{font-size:20px;font-weight:700;padding:10px 12px;}
  .edit .two{display:flex;gap:8px;}
  .edit .two select{flex:1;}
  .edit .card{padding:4px 0;}
  .edit .sub{margin:12px 2px 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
  .need{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);}
  .need:first-child{border-top:0;}
  .need .main{flex:1;min-width:0;}
  .need-text{font-size:14.5px;font-weight:600;word-break:break-word;}
  .need-last{font-size:12px;color:var(--muted);}
  .drop{font-size:13px;color:var(--muted);flex:0 0 auto;}
  .need-add{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);}
  .need-add [data-f="need-what"]{flex:1 1 100%;}
  .need-add [data-f="need-every"]{flex:0 0 76px;}
  .need-add [data-f="need-unit"]{flex:1;}
  .need-add [data-f="need-who"]{flex:1 1 100%;}
  .edit .repair{display:flex;flex-direction:column;gap:6px;padding:10px 12px;}
  .fld{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .fld input{flex:1;}
  a.manual{font-size:14px;font-weight:600;color:var(--accent);}
  .fields{padding:6px 12px;font-size:13.5px;word-break:break-word;}
  .fields div{padding:5px 0;border-top:1px solid var(--line);}
  .fields div:first-child{border-top:0;}
  .row-btns{display:flex;gap:8px;margin:6px 0 10px;}
  .row-btns .btn{flex:1;height:42px;text-align:center;}
  .lock{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:2px 2px 8px;}
  #hint{font-size:13px;color:var(--muted);margin:10px 2px;}
  /* bottom bar, +, status */
  .fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:84px;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:6;}
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;}
  #tabs button{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:12px;font-weight:600;color:var(--muted);position:relative;}
  #tabs button[aria-current="page"]{color:var(--accent);}
  #tabs .tab-ico{width:54px;height:28px;border-radius:999px;display:grid;place-items:center;}
  #tabs button[aria-current="page"] .tab-ico{background:var(--soft);}
  .badge{position:absolute;top:0;left:calc(50% + 9px);min-width:18px;height:18px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;}
  #status{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:8;max-width:min(92%,480px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:13.5px;margin:0;}
  #status:empty{display:none;}
  /* sheets */
  .scrim{position:fixed;inset:0;background:rgba(20,14,24,.38);z-index:10;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;}
  .sheet h3{margin:0 0 4px;font-size:18px;}
  .sheet p{margin:0 0 10px;color:var(--muted);font-size:14px;}
  .capture{display:flex;gap:8px;}
  .capture input{flex:1;height:48px;}
  .capture .btn{height:48px;}
  .more-item{margin:14px 0;}
  .more-item label.btn{display:inline-flex;align-items:center;}
  .importbox summary{font-size:15px;font-weight:600;cursor:pointer;padding:6px 0;}
  .importbox textarea{display:block;width:100%;margin:6px 0 8px;font-size:14px;resize:vertical;}
  .ver{font-size:12px;color:var(--muted);}
</style>
</head>
<body data-view="due">
<div class="app">
  <header>
    <button class="iconbtn" id="back" type="button" aria-label="Back" hidden></button>
    <h1 id="title">Due</h1>
    <button class="iconbtn" id="more-btn" type="button" aria-label="More"></button>
  </header>
  <main>
    <section class="view v-due">
      <div class="stats" id="due-stats"></div>
      <div id="due"></div>
      <div id="due-calm"></div>
    </section>
    <section class="view v-spaces">
      <p class="sub" id="count"></p>
      <input id="search" type="search" placeholder="Find a thing or a room" autocomplete="off" aria-label="Search">
      <div id="results"></div>
      <div id="tiles"></div>
    </section>
    <section class="view v-space">
      <div id="list"></div>
      <p id="hint"></p>
    </section>
    <section class="view v-thing"><div id="thing"></div></section>
    <section class="view v-art">
      <p class="lock" id="art-lock"></p>
      <div id="art-list"></div>
    </section>
  </main>
</div>
<p id="status" role="status"></p>
<button class="fab" id="fab" type="button" aria-label="Add" hidden></button>
<nav id="tabs"></nav>

<div class="scrim" id="add-sheet" hidden><div class="sheet" role="dialog" aria-label="Add">
  <div class="grab"></div>
  <h3>Add</h3>
  <p>Say a room: "Kitchen has a fridge, a kettle and two stools". A name alone adds an empty space.</p>
  <div class="capture">
    <input id="field" placeholder="A room, or a room and its things" autocomplete="off" enterkeyhint="done">
    <button class="btn pri" id="add" type="button">Add</button>
  </div>
</div></div>

<div class="scrim" id="more-sheet" hidden><div class="sheet" role="dialog" aria-label="More">
  <div class="grab"></div>
  <h3>More</h3>
  <!-- Lares 3: the art file is read on the phone only; there is no way back out. -->
  <div class="more-item"><label class="btn" for="art-file">Import art file</label>
    <input type="file" id="art-file" accept=".json,application/json" hidden></div>
  <!-- Lares 9: an import list drafted in a session (spaces → things → needs), pasted here. -->
  <details class="importbox more-item"><summary>Import a list</summary>
    <textarea id="import-text" rows="4" placeholder="Paste an import list drafted in a session" autocomplete="off"></textarea>
    <button class="btn pri" id="import-go" type="button">Import</button>
  </details>
  <!-- Keep in step with CACHE in sw.js — the visible proof of which build is running. -->
  <p class="ver">lares-v9</p>
</div></div>

<script>
// State: one JSON document in localStorage, on one device. No backup, no sync.
// A space is a room or area; a thing sits in exactly one space (house twin,
// kairos_v3/kairos-system/docs/DESIGN_NOTE_house_twin.md). Name, kind and
// space are enough to save a thing; later stories add the other fields.
const KEY = 'lares:v1';
const KINDS = ['appliance', 'furniture', 'fixture', 'art', 'other'];
// Say a room (Lares 7): the phone's keyboard turns speech into text; the
// page only splits it. A kind is guessed from these words, else the
// space's kind selector (else 'other' for a whole room).
const KIND_WORDS = {
  appliance: ['dishwasher', 'fridge', 'refrigerator', 'freezer', 'oven', 'stove', 'cooker', 'hob', 'microwave',
    'toaster', 'kettle', 'coffee machine', 'espresso machine', 'washing machine', 'washer', 'dryer', 'boiler',
    'furnace', 'water heater', 'heat pump', 'air conditioner', 'dehumidifier', 'humidifier', 'vacuum', 'tv',
    'television', 'router', 'extractor', 'range hood', 'blender', 'mixer', 'iron', 'fan', 'water softener'],
  furniture: ['sofa', 'couch', 'chair', 'armchair', 'table', 'desk', 'bed', 'wardrobe', 'dresser', 'shelf',
    'shelves', 'bookcase', 'cabinet', 'stool', 'bench', 'sideboard', 'cupboard', 'chest', 'nightstand', 'rug', 'mirror'],
  fixture: ['sink', 'tap', 'faucet', 'toilet', 'shower', 'bath', 'bathtub', 'radiator', 'light', 'lamp', 'window',
    'door', 'fireplace', 'thermostat', 'smoke alarm', 'socket', 'switch', 'heater',
    'lock', 'keypad', 'deadbolt'],   // locks are fixtures until Lares 6 gives them a kind
};
let state = { spaces: [], things: [] };
let editing = null;   // id of the thing whose page is open

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const kindOptions = sel => KINDS.map(k => `<option value="${k}"${k === sel ? ' selected' : ''}>${k}</option>`).join('');

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); state = { spaces: d.spaces || [], things: d.things || [] }; }
  } catch (e) { $('status').textContent = 'Starting fresh.'; }
  render();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); $('status').textContent = ''; return true; }
  catch (e) { $('status').textContent = 'Not saved — this browser is blocking storage.'; return false; }
}
function plural(n, one){ return n + ' ' + one + (n === 1 ? '' : 's'); }

/* ---- icons: inline, no network ---- */
const ICONS = {
  due:'<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/>',
  home:'<path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/>',
  art:'<rect x="4.5" y="5" width="15" height="14" rx="1.5"/><path d="m7 16 3.5-4 3 3 2-2 2.5 3"/><circle cx="9" cy="9" r="1.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', back:'<path d="M14.5 6 8.5 12l6 6"/>', chev:'<path d="m9.5 6 6 6-6 6"/>',
  more:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
  pot:'<path d="M5 10h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M3 10h18M9 7c0-1 .5-2 0-3M13 7c0-1 .5-2 0-3"/>',
  sofa:'<path d="M5 11V8.5A2.5 2.5 0 0 1 7.5 6h9A2.5 2.5 0 0 1 19 8.5V11"/><path d="M3.5 12a1.5 1.5 0 0 1 3 0v2h11v-2a1.5 1.5 0 0 1 3 0V17h-17z"/><path d="M6 17v2M18 17v2"/>',
  drop:'<path d="M12 4c3.5 4.5 5.5 7.5 5.5 10a5.5 5.5 0 0 1-11 0C6.5 11.5 8.5 8.5 12 4z"/>',
  stairs:'<path d="M4 19h4v-4h4v-4h4V7h4"/>', leaf:'<path d="M5 19c0-8 5-13 14-13 0 9-5 14-13 14"/><path d="M5 19 13 11"/>',
  car:'<path d="M5 16v-4l2-4.5h10L19 12v4"/><path d="M4 16h16v2.5H4z"/><circle cx="8" cy="16.5" r="1"/><circle cx="16" cy="16.5" r="1"/>',
  bed:'<path d="M4 18V7M4 14h16v4M20 14v-2a3 3 0 0 0-3-3h-6v5"/><circle cx="7.5" cy="11" r="1.5"/>',
  desk:'<path d="M3.5 9h17M5 9v10M19 9v10M13 9v5h6"/>', door:'<path d="M7 20V4h10v16M5 20h14"/><circle cx="14" cy="12" r=".9"/>',
  thing:'<rect x="5" y="5" width="14" height="14" rx="3"/>',
  wrench:'<path d="M14.5 5.5a4 4 0 0 0 4 5.5l-8 8a2 2 0 0 1-3-3l8-8a4 4 0 0 1-1-2.5z"/>',
  lock:'<rect x="6" y="11" width="12" height="9" rx="2"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/>',
};
const icon = (k, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k] || ICONS.thing}</svg>`;
// A space's icon is guessed from its name (N.: no icon picker).
const SPACE_ICONS = [[/kitchen|pantry/, 'pot'], [/living|lounge|family|den/, 'sofa'], [/bath|shower|toilet|wc|powder|laundry/, 'drop'],
  [/basement|cellar|stair|attic/, 'stairs'], [/garden|yard|patio|deck|outside|outdoor|balcony/, 'leaf'], [/garage|car|drive/, 'car'],
  [/bed|nursery|kid/, 'bed'], [/office|study|desk/, 'desk'], [/hall|entr|foyer|mud/, 'door'], [/art/, 'art']];
const spaceIcon = name => (SPACE_ICONS.find(([re]) => re.test(name.toLowerCase())) || [0, 'home'])[1];
const KIND_ICONS = { appliance:'wrench', fixture:'thing', furniture:'sofa', art:'art', other:'thing' };
const isArt = t => t.kind === 'art' || !!t.art;

/* ---- navigation: a stack of views; the tabs reset it ---- */
let stack = [{ view: 'due' }];
const here = () => stack[stack.length - 1];
function goTab(tab){ editing = null; stack = [{ view: tab }]; closeSheets(); render(); scrollTo(0, 0); }
function go(v){ stack.push(v); render(); scrollTo(0, 0); }
function goBack(){
  if (stack.length > 1) stack.pop();
  editing = here().view === 'thing' ? here().id : null;
  render(); scrollTo(0, 0);
}
function openThing(id){ editing = id; go({ view: 'thing', id }); }
function closeThing(){ editing = null; if (here().view === 'thing') stack.pop(); }
function closeSheets(){ $('add-sheet').hidden = true; $('more-sheet').hidden = true; }

/* ---- rows ---- */
function thingRow(t){
  const today = dayOf(isoDate(new Date()));
  const st = (t.needs || []).map(n => standing(n, today)).filter(s => s.show).sort((a, b) => a.key - b.key)[0];
  const sub = t.art ? [t.art.artist, t.art.medium].filter(Boolean).join(' · ') || 'art'
    : [t.kind, (t.needs || []).length ? plural(t.needs.length, 'need') : ''].filter(Boolean).join(' · ');
  return `<button class="row" data-thing="${t.id}" type="button"><span class="ico">${icon(KIND_ICONS[t.kind])}</span>
    <span class="main"><span class="thing">${esc(t.name)}</span><span class="s">${esc(sub)}</span></span>
    ${st ? `<span class="pill ${pillClass(st)}">${st.text}</span>` : ''}<span class="chev">${icon('chev', 16)}</span></button>`;
}
function tile(s){
  const today = dayOf(isoDate(new Date()));
  const ts = state.things.filter(t => t.space === s.id);
  const st = ts.flatMap(t => (t.needs || []).map(n => standing(n, today))).filter(x => x.show);
  const late = st.filter(x => x.late).length, due = st.length - late;
  return `<button class="tile" data-tile="${s.id}" type="button"><span class="ico">${icon(spaceIcon(s.name))}</span>
    <span class="tile-name">${esc(s.name)}</span><span class="meta">${plural(ts.length, 'thing')}</span>
    <span class="foot">${late ? `<span class="pill late">${late} overdue</span>` : ''}${due ? `<span class="pill now">${due} due</span>` : ''}${!st.length ? '<span class="pill">all good</span>' : ''}</span></button>`;
}
const pillClass = s => s.late ? 'late' : /this month|today/.test(s.text) ? 'now' : '';

/* ---- a thing's page: everything about it, edited in place ---- */
function thingPage(t){

      <div class="need-add">

        <select data-f="need-unit" aria-label="Unit">${UNITS.map(u => `<option${u === 'months' ? ' selected' : ''}>${u}</option>`).join('')}</select>

      <input data-f="repair-codes" placeholder="Error codes" value="${esc(r.codes || '')}" autocomplete="off">

// Lares 2 — what each thing needs. A need is { what, every, unit, who, last };
// it is due when last + every has come, or within DUE_AHEAD days, or when it
// was never done. "Done" sets last to today. Repair facts sit beside them.
const UNITS = ['days', 'weeks', 'months', 'years'];
const DUE_AHEAD = 14;
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function nextDue(n){
  if (!n.last) return null;
  const d = dayOf(n.last);
  if (n.unit === 'days') d.setDate(d.getDate() + n.every);
  else if (n.unit === 'weeks') d.setDate(d.getDate() + 7 * n.every);
  else if (n.unit === 'months') d.setMonth(d.getMonth() + n.every);
  else d.setFullYear(d.getFullYear() + n.every);
  return d;
}
const needText = n => `${n.what} · every ${n.every === 1 ? n.unit.replace(/s$/, '') : n.every + ' ' + n.unit}${n.who ? ' · ' + n.who : ''}`;
// When a need stands. In days or weeks it falls on a day. In months or years
// it falls in a month (N., 2026-11-07): due during that whole month, overdue
// only from the 1st of the next, and shown from DUE_AHEAD days before the
// month starts. `key` sorts the list: days left until it becomes overdue.
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAY = 86400000;
function standing(n, today){
  const due = nextDue(n);
  if (!due) return { key: -Infinity, show: true, late: false, text: 'never done' };
  if (n.unit === 'days' || n.unit === 'weeks') {
    const days = Math.round((due - today) / DAY);
    return { key: days, show: days <= DUE_AHEAD, late: days < 0,
      text: days < 0 ? `overdue ${plural(-days, 'day')}` : days === 0 ? 'due today' : `due in ${plural(days, 'day')}` };
  }
  const start = new Date(due.getFullYear(), due.getMonth(), 1);
  const end = new Date(due.getFullYear(), due.getMonth() + 1, 1);
  const name = MONTH_NAMES[start.getMonth()] + (start.getFullYear() === today.getFullYear() ? '' : ' ' + start.getFullYear());
  const key = Math.round((end - today) / DAY) - 1;
  if (today >= end) return { key, show: true, late: true, text: `overdue since ${name}` };
  if (today >= start) return { key, show: true, late: false, text: 'due this month' };
  return { key, show: Math.round((start - today) / DAY) <= DUE_AHEAD, late: false, text: `due in ${name}` };
}
// What the open editor holds goes into the thing (Save, and before a need changes).
function readEditor(edit, t){
  const v = f => edit.querySelector(`[data-f="${f}"]`).value.trim();
  if (v('name')) t.name = v('name');
  t.kind = v('kind');
  t.space = v('space');
  const repair = { manual: v('repair-manual'), codes: v('repair-codes'), parts: v('repair-parts'), warranty: v('repair-warranty') };
  if (Object.values(repair).some(Boolean)) t.repair = repair; else delete t.repair;
}


// Due, grouped: never done, overdue, due now, coming up (soonest first in each).
const DUE_GROUPS = ['Never done', 'Overdue', 'Due now', 'Coming up'];
function dueGroup(s){ return s.key === -Infinity ? 0 : s.late ? 1 : /this month|today/.test(s.text) ? 2 : 3; }
function renderDue(){
  const today = dayOf(isoDate(new Date()));
  const items = state.things.flatMap(t => (t.needs || []).map(n => ({ t, n, s: standing(n, today) })))
    .filter(x => x.s.show).map(x => ({ ...x, g: dueGroup(x.s) })).sort((a, b) => a.g - b.g || a.s.key - b.s.key);
  const late = items.filter(x => x.s.late).length, now = items.filter(x => x.g === 0 || x.g === 2).length;
  $('due-stats').innerHTML = `<div class="stat late"><b>${late}</b><span>overdue</span></div>
    <div class="stat"><b>${now}</b><span>due now</span></div><div class="stat"><b>${state.things.length}</b><span>things</span></div>`;
  $('due').innerHTML = DUE_GROUPS.map((h, g) => {
    const xs = items.filter(x => x.g === g);
    return xs.length ? `<h2>${h}</h2><div class="card">${xs.map(({ t, n, s }) => {
      const sp = state.spaces.find(x => x.id === t.space);
      return `<div class="row due-row" data-due-thing="${t.id}" data-need="${n.id}">
        <span class="ico">${icon(KIND_ICONS[t.kind])}</span>
        <span class="main"><span class="due-what">${esc(t.name)} · ${esc(n.what)}</span>
          <span class="due-sub">${esc(sp ? sp.name : '')}${n.who ? ' · ' + esc(n.who) : ''}</span>
          <span class="due-when ${pillClass(s)}${s.late ? ' late' : ''}">${s.text}</span></span>
        <button class="btn" type="button" data-act="need-done">Done</button></div>`;
    }).join('')}</div>` : '';
  }).join('');
  $('due-calm').innerHTML = items.length ? '' : `<div class="empty">${state.things.length ? 'Nothing due. The house is in order.' : 'Nothing due yet. Add your spaces and what each thing needs under Spaces.'}</div>`;
  return late;
}

function render(){
  const v = here();
  document.body.dataset.view = v.view;
  const late = renderDue();
  const ns = state.spaces.length, nt = state.things.length;
  $('count').textContent = ns ? plural(ns, 'space') + ' · ' + plural(nt, 'thing') : '';
  $('hint').textContent = nt ? 'Tap a thing to rename, move or delete it.' : '';
  // Spaces: a tile each, or search results while there is a query
  $('tiles').innerHTML = ns ? `<div class="grid">${state.spaces.map(tile).join('')}</div>`
    : '<div class="empty">No spaces yet. Tap + and say a room.</div>';
  renderResults();
  // a page per space; only the open one shows
  const l = $('list');
  if (!ns) l.innerHTML = '<div class="empty">No spaces yet. Add a room or area to start.</div>';
  else l.innerHTML = state.spaces.map(s => {
    const things = state.things.filter(t => t.space === s.id);
    return `<div class="space${v.view === 'space' && v.id === s.id ? ' on' : ''}" data-space="${s.id}">
      <div class="hero"><span class="ico">${icon(spaceIcon(s.name), 22)}</span>
        <span><span class="space-name">${esc(s.name)}</span><span class="n">${plural(things.length, 'thing')}</span></span></div>
      <h2>Things</h2>
      <div class="card">${things.map(thingRow).join('')}
        <div class="add-thing">
          <input data-f="new-thing" placeholder="Add things: a sofa and two chairs" autocomplete="off" enterkeyhint="done">
          <select data-f="new-kind" aria-label="Kind">${kindOptions('other')}</select>
          <button class="btn pri" type="button" data-act="add-thing">Add</button>
        </div></div>
      <div class="actions"><button class="btn danger" type="button" data-act="drop-space" aria-label="Remove this space">Delete space</button></div>
    </div>`;
  }).join('');
  // a thing's page
  const t = editing && state.things.find(x => x.id === editing);
  if (v.view === 'thing' && !t) { stack.pop(); editing = null; return render(); }
  $('thing').innerHTML = t ? thingPage(t) : '';
  // art, by the space it is in
  const art = state.things.filter(isArt);
  $('art-lock').innerHTML = `${icon('lock', 15)} The collection stays on this phone. There is no copy-out.`;
  $('art-list').innerHTML = art.length ? state.spaces.filter(s => art.some(a => a.space === s.id)).map(s =>
    `<h2>${esc(s.name)}</h2><div class="card">${art.filter(a => a.space === s.id).map(thingRow).join('')}</div>`).join('')
    : '<div class="empty">No art yet. Import the art file under More (⋯).</div>';
  // header, tabs, +
  const titles = { due: 'Due', spaces: 'Your home', art: 'Art' };
  $('title').textContent = v.view === 'space' ? (state.spaces.find(s => s.id === v.id) || {}).name || ''
    : v.view === 'thing' ? ((t && state.spaces.find(s => s.id === t.space)) || {}).name || '' : titles[v.view];
  $('back').hidden = stack.length < 2;
  $('back').innerHTML = icon('back', 22);
  $('more-btn').innerHTML = icon('more', 20);
  const root = stack[0].view;
  $('tabs').innerHTML = [['due', 'Due', 'due'], ['spaces', 'Spaces', 'home'], ['art', 'Art', 'art']].map(([k, label, ic]) =>
    `<button type="button" data-tab="${k}"${root === k ? ' aria-current="page"' : ''}><span class="tab-ico">${icon(ic, 21)}</span>${label}${k === 'due' && late ? `<span class="badge">${late}</span>` : ''}</button>`).join('');
  $('fab').hidden = !(v.view === 'spaces' || v.view === 'space');
  $('fab').innerHTML = icon('plus', 26);
}
function renderResults(){
  const q = $('search').value.trim().toLowerCase();
  $('tiles').hidden = !!q;
  if (!q) { $('results').innerHTML = ''; return; }
  const spaces = state.spaces.filter(s => s.name.toLowerCase().includes(q));
  const things = state.things.filter(t => t.name.toLowerCase().includes(q));
  $('results').innerHTML = (spaces.length ? `<h2>Spaces</h2><div class="grid">${spaces.map(tile).join('')}</div>` : '')
    + (things.length ? `<h2>Things</h2><div class="card">${things.map(thingRow).join('')}</div>` : '')
    + (!spaces.length && !things.length ? '<div class="empty">Nothing by that name.</div>' : '');
}

// "a dishwasher, a fridge and two chairs. They're new." → names
// ['Dishwasher', 'Fridge', 'Chair 1', 'Chair 2'], skipped ["They're new"].
// A clause that starts by pointing back ("these are…", "it is…") only
// describes, so it is skipped and named, never saved as a thing.
const NUMBERS = { two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12 };
const COUNT = new RegExp('^(\\d+|' + Object.keys(NUMBERS).join('|') + ')\\s+(.+)$', 'i');
const MAX_COUNT = 12;   // more than this ("40 books") stays one thing, as said
const DESCRIBES = /^(?:these|those|they|theyre|it|its|which|both)\b/i;
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
const singular = s => s.replace(/(\S+)$/, w => w
  .replace(/ies$/i, 'y').replace(/ves$/i, 'f').replace(/(ch|sh|x|ss)es$/i, '$1').replace(/([^su])s$/i, '$1'));
function splitItems(text){
  const names = [], skipped = [];
  for (const part of text.split(/\s*(?:,|;|\n|[.!?]+(?:\s+|$)|\band\b|\bplus\b)\s*/i)) {
    const said = part.trim().replace(/[.!?]+$/, '');
    if (!said) continue;
    if (DESCRIBES.test(said.replace(/'/g, ''))) { skipped.push(said); continue; }
    const name = said.replace(/^(?:an?|the|some|one)\s+/i, '').trim();
    const c = name.match(COUNT);
    const n = c ? Number(NUMBERS[c[1].toLowerCase()] || c[1]) : 1;
    if (n >= 2 && n <= MAX_COUNT) {
      const one = capital(singular(c[2]));
      for (let i = 1; i <= n; i++) names.push(one + ' ' + i);
    } else names.push(capital(name));
  }
  return { names, skipped };
}
// "Kitchen has a fridge" / "Kitchen: a fridge" → ['Kitchen', 'a fridge'], else null.
function splitRoom(text){
  const m = text.match(/^(.+?)\s*(?::|\s(?:has|have|contains|with)\s)\s*(.+)$/i);
  return m ? [m[1].replace(/^(?:in\s+)?the\s+/i, '').trim(), m[2]] : null;
}
function guessKind(name){
  const n = ' ' + name.toLowerCase().replace(/s\b/g, '') + ' ';
  for (const [kind, words] of Object.entries(KIND_WORDS))
    if (words.some(w => n.includes(' ' + w.replace(/s\b/g, '') + ' '))) return kind;
  return null;
}

// Lares 3 — the art file (artworks.json: { works: [...] }), imported on the
// phone. Each work is one thing of kind art with every field kept as it came;
// a work goes to the space its location names, else to "Art to place". A
// second import updates by the work's id. Crown jewels: no copy-out exists.
const ART_SPACE = 'Art to place';
const fieldLabel = k => k.replace(/_/g, ' ');
// A work's fields as [label, text] rows; a nested field shows its path.
function artRows(v, path){
  if (v == null || v === '') return [];
  if (Array.isArray(v)) return v.length ? [[path, v.map(x => x && typeof x === 'object'
    ? Object.entries(x).map(([k, y]) => `${fieldLabel(k)}: ${y}`).join(', ') : String(x)).join('; ')]] : [];
  if (typeof v === 'object')
    return Object.entries(v).flatMap(([k, x]) => artRows(x, path ? path + ' · ' + fieldLabel(k) : capital(fieldLabel(k))));
  return [[path, String(v)]];
}
function importArt(text){
  let works;
  try { const d = JSON.parse(text); works = Array.isArray(d) ? d : d && d.works; } catch (e) { works = null; }
  if (!Array.isArray(works) || !works.length) { $('status').textContent = "That file isn't an art list (no works in it)."; return; }
  let added = 0, updated = 0;
  for (const w of works) {
    if (!w || typeof w !== 'object') continue;
    const name = w.title || `Untitled (${w.artist || 'no artist'})`;
    const hit = w.id != null && state.things.find(t => t.art && t.art.id === w.id);
    if (hit) { hit.art = w; hit.name = name; updated++; continue; }   // it keeps the space it was moved to
    const loc = typeof w.location === 'string' ? w.location.trim().toLowerCase() : '';
    const sp = state.spaces.find(s => s.name.toLowerCase() === loc) || findOrMakeSpace(ART_SPACE);
    state.things.push({ id: newId(), name, kind: 'art', space: sp.id, art: w });
    added++;
  }
  render();
  if (save()) $('status').textContent = `Imported ${plural(added + updated, 'work')}: ${added} new, ${updated} updated.`;
}

function findOrMakeSpace(name){
  const hit = state.spaces.find(s => s.name.toLowerCase() === name.toLowerCase());
  if (hit) return hit;
  const sp = { id: newId(), name: capital(name) };
  state.spaces.push(sp);
  return sp;
}
// Adds the things and returns the status line for it.
function addItems(space, text, fallbackKind){
  const { names, skipped } = splitItems(text);
  for (const name of names) state.things.push({ id: newId(), name, kind: guessKind(name) || fallbackKind, space: space.id });
  return `Added ${plural(names.length, 'thing')} to ${space.name}.`
    + (skipped.length ? ' Skipped: ' + skipped.map(s => `"${s}"`).join(', ') + '.' : '');
}


function addSpace(){
  const field = $('field'); const text = field.value.trim();
  if (!text) return;
  const room = splitRoom(text);
  // "5 locks: …" names a count, not a room: add nothing, keep what was said.
  if (COUNT.test((room ? room[0] : text).replace(/^(?:an?|the)\s+/i, ''))) {
    $('status').textContent = 'Say a room first: "Hall has a lock".';
    return;
  }
  let note = '';
  if (room && room[0]) {
    const sp = findOrMakeSpace(room[0]);
    note = addItems(sp, room[1], 'other');
  } else {
    findOrMakeSpace(text.replace(/[.!?]+$/, ''));
  }
  field.value = '';
  $('add-sheet').hidden = true;
  render(); save();
  if (note) $('status').textContent = note;
}
function addThing(spaceEl){
  const input = spaceEl.querySelector('[data-f="new-thing"]');
  if (!input.value.trim()) return;
  const kind = spaceEl.querySelector('[data-f="new-kind"]').value;
  const space = state.spaces.find(s => s.id === spaceEl.dataset.space);
  const before = state.things.length;
  const note = addItems(space, input.value, kind);
  render(); save();
  if (state.things.length - before > 1 || note.includes('Skipped')) $('status').textContent = note;
  // Keep the cursor in this space's field: several things in a row, in seconds.
  const again = document.querySelector(`[data-space="${space.id}"] [data-f="new-thing"]`);
  if (again) again.focus();
  const sel = document.querySelector(`[data-space="${space.id}"] [data-f="new-kind"]`);
  if (sel) sel.value = kind;
}

$('add').addEventListener('click', addSpace);
$('field').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addSpace(); } });
$('search').addEventListener('input', renderResults);

// Navigation and the controls outside a space's or a thing's page.
document.addEventListener('click', e => {
  const el = e.target.closest('button,[data-due-thing],.scrim');
  if (!el) return;
  if (el.classList.contains('scrim')) { if (e.target === el) closeSheets(); return; }
  if (el.dataset.tab) return goTab(el.dataset.tab);
  if (el.id === 'back') return goBack();
  if (el.id === 'more-btn') { $('more-sheet').hidden = false; return; }
  if (el.id === 'fab') {
    if (here().view === 'space') { const f = document.querySelector('.space.on [data-f="new-thing"]'); if (f) f.focus(); return; }
    $('add-sheet').hidden = false; $('field').focus(); return;
  }
  if (el.dataset.tile) return go({ view: 'space', id: el.dataset.tile });
  const due = e.target.closest('[data-due-thing]');
  if (due) {
    const t = state.things.find(x => x.id === due.dataset.dueThing);
    if (e.target.closest('[data-act="need-done"]')) {
      t.needs.find(x => x.id === due.dataset.need).last = isoDate(new Date());
      render(); save(); return;
    }
    return openThing(t.id);
  }
  if (el.dataset.thing && !el.closest('#thing')) return openThing(el.dataset.thing);
});

$('list').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-f="new-thing"]')) { e.preventDefault(); addThing(e.target.closest('.space')); }
});
$('list').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  const spaceEl = e.target.closest('.space');
  if (act === 'add-thing') return addThing(spaceEl);
  if (act === 'drop-space') {
    // An empty space goes at once; one with things asks first, naming the count.
    const sp = state.spaces.find(s => s.id === spaceEl.dataset.space);
    const n = state.things.filter(t => t.space === sp.id).length;
    if (n && !confirm(`Delete ${sp.name} and its ${plural(n, 'thing')}?`)) return;
    state.things = state.things.filter(t => t.space !== sp.id);
    state.spaces = state.spaces.filter(s => s.id !== sp.id);
    editing = null;
    if (stack.some(v => v.view === 'space' && v.id === sp.id)) stack = [{ view: 'spaces' }];
    render(); save(); return;
  }
});
$('thing').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.closest('.need-add')) { e.preventDefault(); e.target.closest('.edit').querySelector('[data-act="need-add"]').click(); }
  else if (e.target.closest('.edit')) { e.preventDefault(); e.target.closest('.edit').querySelector('[data-act="save"]').click(); }
});
$('thing').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  const edit = e.target.closest('.edit');
  if (!act || !edit) return;
  const t = state.things.find(x => x.id === edit.dataset.edit);
  if (act === 'cancel') { closeThing(); render(); }
  else if (act === 'delete') {
    if (!confirm(`Delete “${t.name}”?`)) return;
    state.things = state.things.filter(x => x.id !== t.id);
    closeThing(); render(); save();
  } else if (act === 'save') {
    if (!edit.querySelector('[data-f="name"]').value.trim()) return;
    readEditor(edit, t);
    closeThing(); render(); save();
  } else if (act === 'need-add') {
    const what = edit.querySelector('[data-f="need-what"]').value.trim();
    const every = Number(edit.querySelector('[data-f="need-every"]').value);
    if (!what || !Number.isInteger(every) || every < 1) return;
    readEditor(edit, t);
    (t.needs = t.needs || []).push({ id: newId(), what, every, unit: edit.querySelector('[data-f="need-unit"]').value,
      who: edit.querySelector('[data-f="need-who"]').value.trim() });
    render(); save();
  } else if (act === 'need-drop') {
    readEditor(edit, t);
    t.needs = t.needs.filter(n => n.id !== e.target.closest('[data-need]').dataset.need);
    render(); save();
  } else if (act === 'need-done') {
    readEditor(edit, t);
    t.needs.find(n => n.id === e.target.closest('[data-need]').dataset.need).last = isoDate(new Date());
    render(); save();
  }
});

// Lares 9 — an import list, drafted in a session and pasted here:
// { spaces: [{ name, things: [{ name, kind?, needs?: [{ what, every, unit, who?, last? }], repair? }] }] }.
// Spaces and things are matched by name (any case), needs by what; nothing is
// ever duplicated, so pasting a list twice changes nothing. A new thing takes
// the kind given (never art: art comes only from the art file) or a guessed
// one; a matched need takes the new how-often and who but keeps when it was
// last done unless the list says. Art records are never touched.
const REPAIR_FIELDS = ['manual', 'codes', 'parts', 'warranty'];
const same = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
function importList(text){
  let d = null;
  try { d = JSON.parse(text); } catch (e) {}
  if (!d || !Array.isArray(d.spaces) || !d.spaces.length) { $('status').textContent = "That isn't an import list (no spaces in it)."; return false; }
  const c = { spaces: 0, things: 0, added: 0, updated: 0, skipped: 0 };
  for (const s of d.spaces) {
    if (!s || typeof s.name !== 'string' || !s.name.trim()) continue;
    let sp = state.spaces.find(x => same(x.name, s.name));
    if (!sp) { sp = findOrMakeSpace(s.name.trim()); c.spaces++; }
    for (const th of Array.isArray(s.things) ? s.things : []) {
      if (!th || typeof th.name !== 'string' || !th.name.trim()) continue;
      let t = state.things.find(x => x.space === sp.id && same(x.name, th.name));
      if (!t) {
        const kind = KINDS.includes(th.kind) && th.kind !== 'art' ? th.kind : guessKind(th.name) || 'other';
        t = { id: newId(), name: th.name.trim(), kind, space: sp.id };
        state.things.push(t); c.things++;
      }
      for (const n of Array.isArray(th.needs) ? th.needs : []) {
        const what = n && typeof n.what === 'string' ? n.what.trim() : '';
        if (!what || !Number.isInteger(n.every) || n.every < 1 || !UNITS.includes(n.unit)) { c.skipped++; continue; }
        const last = typeof n.last === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(n.last) ? n.last : undefined;
        const who = typeof n.who === 'string' ? n.who.trim() : '';
        const hit = (t.needs || []).find(x => same(x.what, what));
        if (hit) { Object.assign(hit, { every: n.every, unit: n.unit, who }); if (last) hit.last = last; c.updated++; }
        else { (t.needs = t.needs || []).push({ id: newId(), what, every: n.every, unit: n.unit, who, ...(last ? { last } : {}) }); c.added++; }
      }
      if (th.repair && typeof th.repair === 'object') {
        const r = Object.fromEntries(REPAIR_FIELDS.filter(k => typeof th.repair[k] === 'string' && th.repair[k].trim()).map(k => [k, th.repair[k].trim()]));
        if (Object.keys(r).length) t.repair = { ...(t.repair || {}), ...r };
      }
    }
  }
  render();
  if (!save()) return false;   // "Not saved" stands, and the text stays in the box
  $('status').textContent = `Imported ${plural(c.added + c.updated, 'need')} (${c.added} new, ${c.updated} updated) · ${plural(c.things, 'new thing')} · ${plural(c.spaces, 'new space')}.`
    + (c.skipped ? ` Skipped ${plural(c.skipped, 'need')} (no what, or no whole-number how often in days, weeks, months or years).` : '');
  return true;
}

$('import-go').addEventListener('click', () => {
  if (importList($('import-text').value)) $('import-text').value = '';
});

$('art-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => importArt(String(r.result));
  r.readAsText(f);
  e.target.value = '';
});

load();
// updateViaCache:'none' keeps the HTTP cache out of sw.js checks, and every
// return to the foreground forces one — for WebViews that skip the re-check.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
  });
}
</script>
</body>
