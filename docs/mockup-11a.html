<!DOCTYPE html>
<!-- Lares 11a — a clickable design mockup on a MADE-UP house (no real thing,
     space, vendor or work). Self-contained: no font, script or image from the
     network, no storage. Open it on the phone, tap through, and use "Design"
     (top right) to switch the look, density, headings and first screen.
     Nothing here is wired to the real app; Done and Add only show what would
     happen. Design note: docs/DESIGN_11a.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lares — design mockup</title>
<style>
  :root, [data-look="hearth"]{
    --bg:#f5efe4; --surface:#fffdf9; --ink:#2a2130; --muted:#75697a; --line:#e6dccd;
    --accent:#4e3a5c; --on-accent:#f3ece0; --soft:#ece3ef; --flame:#e3a64a; --flame-soft:#f8ead2;
    --late:#b3402e; --late-soft:#f6e1dc; --ok:#3f7a55; --bar:#fffdf9; --shadow:0 1px 2px rgba(42,33,48,.06),0 4px 14px rgba(42,33,48,.06);
  }
  [data-look="night"]{
    --bg:#17131b; --surface:#221c28; --ink:#f1eaf3; --muted:#a99db0; --line:#332a3a;
    --accent:#e3a64a; --on-accent:#221c28; --soft:#2e2536; --flame:#e3a64a; --flame-soft:#3a2f22;
    --late:#f08b75; --late-soft:#3d2320; --ok:#8cc7a0; --bar:#1d1822; --shadow:none;
  }
  [data-look="garden"]{
    --bg:#f1f4ef; --surface:#ffffff; --ink:#1b241e; --muted:#5f6c63; --line:#dde5de;
    --accent:#2f6b4f; --on-accent:#ffffff; --soft:#dcebe2; --flame:#c9862c; --flame-soft:#f5e8d4;
    --late:#b3402e; --late-soft:#f6e1dc; --ok:#2f6b4f; --bar:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  }
  [data-density="comfy"]{ --pad:16px; --gap:12px; --row:14px; }
  [data-density="compact"]{ --pad:12px; --gap:8px; --row:10px; }
  [data-heads="serif"] h1,[data-heads="serif"] h2,[data-heads="serif"] .big{font-family:"Iowan Old Style","Palatino Linotype",Georgia,ui-serif,serif;letter-spacing:0;}
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;-webkit-tap-highlight-color:transparent;}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:92px;}
  header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px var(--pad) 10px;}
  header h1{flex:1;margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px;}
  .back{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;margin-left:-6px;}
  .iconbtn{height:36px;padding:0 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);}
  main{padding:0 var(--pad);}
  .sub{color:var(--muted);font-size:14px;margin:-4px 0 14px;}
  h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 2px 8px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
  .row{display:flex;align-items:center;gap:12px;padding:var(--row) 14px;border-top:1px solid var(--line);width:100%;text-align:left;}
  .row:first-child{border-top:0;}
  .row .main{flex:1;min-width:0;}
  .row .t{font-size:16px;font-weight:600;}
  .row .s{font-size:13px;color:var(--muted);margin-top:2px;}
  .chev{color:var(--muted);opacity:.6;}
  .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:0 0 auto;}
  [data-look="night"] .ico{color:var(--flame);}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .pill.late{background:var(--late-soft);color:var(--late);}
  .pill.now{background:var(--flame-soft);color:#8a5a12;}
  [data-look="night"] .pill.now{color:var(--flame);}
  .pill.soon{background:var(--soft);color:var(--accent);}
  [data-look="night"] .pill.soon{color:var(--ink);}
  .pill.never{background:var(--soft);color:var(--muted);}
  .done{height:34px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;background:var(--surface);}
  .done.did{background:var(--ok);border-color:var(--ok);color:#fff;}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:6px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);}
  .stat .big{font-size:26px;font-weight:700;line-height:1;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:4px;}
  .stat.late .big{color:var(--late);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:118px;}
  .tile .name{font-size:16px;font-weight:700;}
  .tile .meta{font-size:12px;color:var(--muted);}
  .tile .foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;}
  .hero{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:16px;margin-bottom:6px;display:flex;gap:14px;align-items:center;}
  .hero .ico{background:rgba(255,255,255,.14);color:var(--flame);}
  [data-look="night"] .hero .ico{background:rgba(0,0,0,.12);color:var(--on-accent);}
  .hero .t{font-size:20px;font-weight:700;}
  .hero .s{font-size:13px;opacity:.85;}
  dl{margin:0;}
  .kv{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:15px;}
  .kv:first-child{border-top:0;}
  .kv dt{color:var(--muted);width:110px;flex:0 0 auto;}
  .kv dd{margin:0;flex:1;word-break:break-word;}
  .kv a{color:var(--accent);font-weight:600;}
  [data-look="night"] .kv a{color:var(--flame);}
  .actions{display:flex;gap:8px;margin:16px 0;}
  .actions button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;}
  .actions .danger{color:var(--late);}
  .note{font-size:13px;color:var(--muted);margin:12px 2px;display:flex;gap:8px;align-items:flex-start;}
  .fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:88px;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:6;}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bar);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));}
  nav .in{max-width:480px;margin:0 auto;display:flex;}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);position:relative;}
  nav button[aria-current="page"]{color:var(--accent);}
  [data-look="night"] nav button[aria-current="page"]{color:var(--flame);}
  nav button[aria-current="page"] .tab-ico{background:var(--soft);}
  .tab-ico{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;}
  .badge{position:absolute;top:2px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;}
  .scrim{position:fixed;inset:0;background:rgba(20,14,24,.38);z-index:10;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;}
  .sheet h3{margin:0 0 4px;font-size:18px;}
  .sheet p{margin:0 0 12px;color:var(--muted);font-size:14px;}
  .opt{margin:14px 0;}
  .opt .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;}
  .seg{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px;}
  .seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .field{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 14px;}
  .primary{width:100%;height:50px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;margin-top:10px;}
  .hint{font-size:13px;color:var(--muted);margin-top:8px;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;}
  .empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px;}
  .search{display:flex;align-items:center;gap:8px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:0 12px;color:var(--muted);font-size:15px;margin-bottom:6px;}
</style>
</head>
<body data-look="hearth" data-density="comfy" data-heads="sans">
<div class="app">
  <header id="top"></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" type="button" aria-label="Add" hidden></button>
<nav><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
// ---- made-up house (relative dates so the statuses stay live) ----
const today = new Date(); today.setHours(0,0,0,0);
const ymd = d => d.toISOString().slice(0,10);
const ago = (months, days = 0) => { const d = new Date(today); d.setMonth(d.getMonth() - months); d.setDate(d.getDate() - days); return ymd(d); };
const SPACES = [
  { id:'k', name:'Kitchen', icon:'pot' }, { id:'l', name:'Living room', icon:'sofa' },
  { id:'b', name:'Bathroom', icon:'drop' }, { id:'c', name:'Basement', icon:'stairs' },
  { id:'g', name:'Garden', icon:'leaf' }, { id:'r', name:'Garage', icon:'car' },
];
const THINGS = [
  { id:'t1', space:'k', name:'Fridge', kind:'appliance', needs:[{ id:'n1', what:'Clean the coils', every:6, unit:'months', who:'me', last:ago(6, 0) }],
    repair:{ manual:'Model X-200 manual', codes:'E1: door open · E4: sensor', parts:'Water filter F-1', warranty:'2028-03-31' } },
  { id:'t2', space:'k', name:'Dishwasher', kind:'appliance', needs:[{ id:'n2', what:'Clean the filter', every:4, unit:'weeks', who:'me', last:ago(0, 33) }] },
  { id:'t3', space:'k', name:'Oven', kind:'appliance', needs:[] },
  { id:'t4', space:'l', name:'Fireplace', kind:'fixture', needs:[{ id:'n4', what:'Chimney sweep', every:1, unit:'years', who:'Example Sweeps', last:ago(13) }] },
  { id:'t5', space:'l', name:'Sofa', kind:'furniture', needs:[] },
  { id:'t6', space:'b', name:'Shower', kind:'fixture', needs:[{ id:'n6', what:'Descale the head', every:3, unit:'months', who:'me' }] },
  { id:'t7', space:'c', name:'Boiler', kind:'appliance', needs:[{ id:'n7', what:'Annual service', every:1, unit:'years', who:'Acme Heating', last:ago(11, -10) }] },
  { id:'t8', space:'c', name:'Water softener', kind:'appliance', needs:[{ id:'n8', what:'Add salt', every:6, unit:'weeks', who:'me', last:ago(0, 20) }] },
  { id:'t9', space:'g', name:'Lawn mower', kind:'appliance', needs:[{ id:'n9', what:'Sharpen the blade', every:1, unit:'years', who:'me', last:ago(3) }] },
  { id:'t10', space:'g', name:'Sprinklers', kind:'fixture', needs:[{ id:'n10', what:'Shut down', every:1, unit:'years', who:'Green Co', last:ago(12) }] },
  { id:'t11', space:'r', name:'Bike rack', kind:'furniture', needs:[] },
];
const ART = [
  { id:'a1', title:'Blue Study', artist:'Ann Example', medium:'Etching', date:'1961', space:'l', fields:[['Series','Studies'],['Edition','12/40'],['Dimensions · sheet','28 × 38 cm'],['Frame','Oak, museum glass'],['Care','Away from direct sun']] },
  { id:'a2', title:'Grey Field', artist:'Bo Sample', medium:'Lithograph', date:'1974', space:'l', fields:[['Edition','3/25'],['Dimensions · image','40 × 50 cm']] },
  { id:'a3', title:'Untitled (harbour)', artist:'Cy Fixture', medium:'Woodcut', date:'c. 1930', space:null, fields:[['Condition','Light foxing at the edges']] },
];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const space = id => SPACES.find(s => s.id === id);

// ---- when a need stands (the real rule: days/weeks by the day; months/years by the month) ----
function standing(n){
  if (!n.last) return { key:-1e9, cls:'never', text:'Never done', bucket:'now' };
  const d = new Date(n.last + 'T00:00:00');
  if (n.unit === 'days') d.setDate(d.getDate() + n.every);
  else if (n.unit === 'weeks') d.setDate(d.getDate() + 7 * n.every);
  else if (n.unit === 'months') d.setMonth(d.getMonth() + n.every);
  else d.setFullYear(d.getFullYear() + n.every);
  const DAY = 864e5;
  if (n.unit === 'days' || n.unit === 'weeks') {
    const k = Math.round((d - today) / DAY);
    if (k < 0) return { key:k, cls:'late', text:`${-k} days late`, bucket:'late' };
    if (k <= 14) return { key:k, cls:'now', text: k === 0 ? 'Today' : `In ${k} days`, bucket:'now' };
    return { key:k, cls:'soon', text:`In ${k} days`, bucket:'later' };
  }
  const start = new Date(d.getFullYear(), d.getMonth(), 1), end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  const name = MONTHS[start.getMonth()] + (start.getFullYear() === today.getFullYear() ? '' : ' ' + start.getFullYear());
  const key = Math.round((end - today) / DAY) - 1;
  if (today >= end) return { key, cls:'late', text:`Since ${name}`, bucket:'late' };
  if (today >= start) return { key, cls:'now', text:'This month', bucket:'now' };
  return { key, cls:'soon', text:name, bucket: Math.round((start - today) / DAY) <= 14 ? 'next' : 'later' };
}
const allNeeds = () => THINGS.flatMap(t => t.needs.map(n => ({ t, n, s: standing(n) })));
const dueNeeds = () => allNeeds().filter(x => x.s.bucket !== 'later').sort((a, b) => a.s.key - b.s.key);

// ---- icons (inline, no network) ----
const P = {
  due:'<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/>',
  home:'<path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/>',
  art:'<rect x="4.5" y="5" width="15" height="14" rx="1.5"/><path d="m7 16 3.5-4 3 3 2-2 2.5 3"/><circle cx="9" cy="9" r="1.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', back:'<path d="M14.5 6 8.5 12l6 6"/>', chev:'<path d="m9.5 6 6 6-6 6"/>',
  pot:'<path d="M5 10h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M3 10h18M9 7c0-1 .5-2 0-3M13 7c0-1 .5-2 0-3"/>',
  sofa:'<path d="M5 11V8.5A2.5 2.5 0 0 1 7.5 6h9A2.5 2.5 0 0 1 19 8.5V11"/><path d="M3.5 12a1.5 1.5 0 0 1 3 0v2h11v-2a1.5 1.5 0 0 1 3 0V17h-17z"/><path d="M6 17v2M18 17v2"/>',
  drop:'<path d="M12 4c3.5 4.5 5.5 7.5 5.5 10a5.5 5.5 0 0 1-11 0C6.5 11.5 8.5 8.5 12 4z"/>',
  stairs:'<path d="M4 19h4v-4h4v-4h4V7h4"/>', leaf:'<path d="M5 19c0-8 5-13 14-13 0 9-5 14-13 14"/><path d="M5 19 13 11"/>',
  car:'<path d="M5 16v-4l2-4.5h10L19 12v4"/><path d="M4 16h16v2.5H4z"/><circle cx="8" cy="16.5" r="1"/><circle cx="16" cy="16.5" r="1"/>',
  thing:'<rect x="5" y="5" width="14" height="14" rx="3"/>', wrench:'<path d="M14.5 5.5a4 4 0 0 0 4 5.5l-8 8a2 2 0 0 1-3-3l8-8a4 4 0 0 1-1-2.5z"/>',
  lock:'<rect x="6" y="11" width="12" height="9" rx="2"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/>', mic:'<rect x="9.5" y="4" width="5" height="10" rx="2.5"/><path d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',
};
const icon = (k, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k] || P.thing}</svg>`;
const KIND_ICON = { appliance:'wrench', fixture:'thing', furniture:'sofa', art:'art', other:'thing' };

// ---- navigation ----
let first = 'due';
let stack = [{ tab:'due' }];
const cur = () => stack[stack.length - 1];
const go = v => { stack.push(v); render(); scrollTo(0, 0); };
const back = () => { if (stack.length > 1) stack.pop(); render(); scrollTo(0, 0); };
const tab = t => { stack = [{ tab:t }]; render(); scrollTo(0, 0); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }

// ---- screens ----
function needRow({ t, n, s }, showThing){
  return `<div class="row">
    <div class="ico">${icon(KIND_ICON[t.kind])}</div>
    <div class="main"><div class="t">${showThing ? esc(t.name) + ' · ' : ''}${esc(n.what)}</div>
      <div class="s">${showThing ? esc(space(t.space).name) + ' · ' : ''}every ${n.every === 1 ? n.unit.replace(/s$/, '') : n.every + ' ' + n.unit}${n.who ? ' · ' + esc(n.who) : ''}</div>
      <div style="margin-top:6px"><span class="pill ${s.cls}">${s.text}</span></div></div>
    <button class="done" data-done="${n.id}" type="button">Done</button></div>`;
}
function dueScreen(){
  const d = dueNeeds(), late = d.filter(x => x.s.bucket === 'late'), now = d.filter(x => x.s.bucket === 'now'), next = d.filter(x => x.s.bucket === 'next');
  const groups = [['Overdue', late], ['Due now', now], ['Coming up', next]].filter(g => g[1].length);
  return `<p class="sub">${today.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' })}</p>
    <div class="summary"><div class="stat late"><div class="big">${late.length}</div><div class="l">overdue</div></div>
      <div class="stat"><div class="big">${now.length}</div><div class="l">due now</div></div>
      <div class="stat"><div class="big">${THINGS.length}</div><div class="l">things</div></div></div>
    ${groups.map(([h, xs]) => `<h2>${h}</h2><div class="card">${xs.map(x => `<div data-thing="${x.t.id}" role="button" tabindex="0" style="cursor:pointer">${needRow(x, true)}</div>`).join('')}</div>`).join('')
      || '<div class="empty">Nothing due. The house is in order.</div>'}`;
}
function spacesScreen(){
  return `<div class="search">${icon('search', 18)} Find a thing or a room</div>
    <h2>${SPACES.length} spaces</h2>
    <div class="grid">${SPACES.map(s => {
      const ts = THINGS.filter(t => t.space === s.id), due = dueNeeds().filter(x => x.t.space === s.id), late = due.filter(x => x.s.bucket === 'late').length;
      return `<button class="tile" data-space="${s.id}" type="button"><div class="ico">${icon(s.icon)}</div>
        <div><div class="name">${esc(s.name)}</div><div class="meta">${ts.length} thing${ts.length === 1 ? '' : 's'}</div></div>
        <div class="foot">${late ? `<span class="pill late">${late} overdue</span>` : ''}${due.length - late ? `<span class="pill now">${due.length - late} due</span>` : ''}${!due.length ? '<span class="pill never">All good</span>' : ''}</div></button>`;
    }).join('')}</div>`;
}
function spaceScreen(id){
  const s = space(id), ts = THINGS.filter(t => t.space === id), art = ART.filter(a => a.space === id);
  return `<div class="hero"><div class="ico">${icon(s.icon, 24)}</div><div><div class="t">${esc(s.name)}</div><div class="s">${ts.length} thing${ts.length === 1 ? '' : 's'}${art.length ? ' · ' + art.length + ' works of art' : ''}</div></div></div>
    <h2>Things</h2><div class="card">${ts.map(t => {
      const st = t.needs.map(standing).sort((a, b) => a.key - b.key)[0];
      return `<button class="row" data-thing="${t.id}" type="button"><div class="ico">${icon(KIND_ICON[t.kind])}</div>
        <div class="main"><div class="t">${esc(t.name)}</div><div class="s">${t.kind}${t.needs.length ? ' · ' + t.needs.length + ' need' + (t.needs.length > 1 ? 's' : '') : ''}</div></div>
        ${st && st.bucket !== 'later' ? `<span class="pill ${st.cls}">${st.text}</span>` : ''}<span class="chev">${icon('chev', 18)}</span></button>`;
    }).join('')}</div>
    ${art.length ? `<h2>Art here</h2><div class="card">${art.map(artRow).join('')}</div>` : ''}
    <div class="actions"><button type="button" data-mock="Rename the space">Rename</button><button class="danger" type="button" data-mock="Asks first, names the count">Delete space</button></div>`;
}
function thingScreen(id){
  const t = THINGS.find(x => x.id === id), r = t.repair;
  return `<div class="hero"><div class="ico">${icon(KIND_ICON[t.kind], 24)}</div><div><div class="t">${esc(t.name)}</div><div class="s">${t.kind} · ${esc(space(t.space).name)}</div></div></div>
    <h2>Needs</h2><div class="card">${t.needs.length ? t.needs.map(n => needRow({ t, n, s: standing(n) }, false)).join('') : '<div class="empty">No needs yet.</div>'}
      <button class="row" type="button" data-mock="Add a need: what, every N days/weeks/months/years, who" style="color:var(--accent);font-weight:600">${icon('plus', 20)} Add a need</button></div>
    <h2>Repair</h2><div class="card"><dl>
      <div class="kv"><dt>Manual</dt><dd>${r ? `<a href="#" data-mock="Opens the manual">${esc(r.manual)}</a>` : '<span style="color:var(--muted)">—</span>'}</dd></div>
      <div class="kv"><dt>Error codes</dt><dd>${r ? esc(r.codes) : '—'}</dd></div>
      <div class="kv"><dt>Parts</dt><dd>${r ? esc(r.parts) : '—'}</dd></div>
      <div class="kv"><dt>Warranty ends</dt><dd>${r ? esc(r.warranty) : '—'}</dd></div></dl></div>
    <div class="actions"><button type="button" data-mock="Edit name, kind and repair facts">Edit</button><button type="button" data-mock="Move to another space">Move</button><button class="danger" type="button" data-mock="Asks first">Delete</button></div>`;
}
const artRow = a => `<button class="row" data-art="${a.id}" type="button"><div class="ico">${icon('art')}</div>
  <div class="main"><div class="t">${esc(a.title)}</div><div class="s">${esc(a.artist)} · ${esc(a.medium)}, ${esc(a.date)}</div></div><span class="chev">${icon('chev', 18)}</span></button>`;
function artScreen(){
  const placed = ART.filter(a => a.space), loose = ART.filter(a => !a.space);
  return `<p class="note">${icon('lock', 16)} The collection stays on this phone. There is no copy-out.</p>
    ${SPACES.filter(s => placed.some(a => a.space === s.id)).map(s => `<h2>${esc(s.name)}</h2><div class="card">${placed.filter(a => a.space === s.id).map(artRow).join('')}</div>`).join('')}
    ${loose.length ? `<h2>To place</h2><div class="card">${loose.map(artRow).join('')}</div>` : ''}`;
}
function artDetail(id){
  const a = ART.find(x => x.id === id);
  return `<div class="hero"><div class="ico">${icon('art', 24)}</div><div><div class="t">${esc(a.title)}</div><div class="s">${esc(a.artist)} · ${esc(a.date)}</div></div></div>
    <h2>The work</h2><div class="card"><dl><div class="kv"><dt>Medium</dt><dd>${esc(a.medium)}</dd></div>${a.fields.map(([k, v]) => `<div class="kv"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div>
    <p class="note">${icon('lock', 16)} Read-only, from the art file. Never copied out.</p>`;
}

// ---- render ----
const TABS = [['due', 'Due', 'due'], ['spaces', 'Spaces', 'home'], ['art', 'Art', 'art']];
function render(){
  const v = cur(), nLate = dueNeeds().filter(x => x.s.bucket === 'late').length;
  const titles = { due:'Due', spaces:'Your home', art:'Art' };
  const isRoot = !!v.tab;
  document.getElementById('top').innerHTML = `${isRoot ? '' : `<button class="back" type="button" data-back aria-label="Back">${icon('back')}</button>`}
    <h1>${isRoot ? titles[v.tab] : ''}</h1><button class="iconbtn" type="button" data-design>Design</button>`;
  document.getElementById('view').innerHTML =
    v.tab === 'due' ? dueScreen() : v.tab === 'spaces' ? spacesScreen() : v.tab === 'art' ? artScreen()
    : v.space ? spaceScreen(v.space) : v.thing ? thingScreen(v.thing) : artDetail(v.art);
  const root = stack[0].tab;
  document.getElementById('tabs').innerHTML = TABS.map(([k, l, i]) => `<button type="button" data-tab="${k}" ${root === k ? 'aria-current="page"' : ''}>
    <span class="tab-ico">${icon(i)}</span>${l}${k === 'due' && nLate ? `<span class="badge">${nLate}</span>` : ''}</button>`).join('');
  const fab = document.getElementById('fab');
  fab.hidden = !(v.tab === 'spaces' || v.space); fab.innerHTML = icon('plus', 26);
}

// ---- sheets ----
const layer = document.getElementById('layer');
const close = () => { layer.innerHTML = ''; };
function sheet(html){ layer.innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`; }
function addSheet(){
  const where = cur().space ? space(cur().space).name : null;
  sheet(`<h3>${where ? 'Add to ' + esc(where) : 'Add'}</h3>
    <p>${where ? 'Say or type things: "a sofa and two armchairs".' : 'Say a room: "Kitchen has a fridge, a kettle and two stools".'}</p>
    <div style="position:relative"><input class="field" placeholder="${where ? 'Things…' : 'A room, or a room and its things…'}"><span style="position:absolute;right:12px;top:13px;color:var(--muted)">${icon('mic')}</span></div>
    <button class="primary" type="button" data-mock="Added (mockup)">Add</button>
    <div class="hint">Import a list or the art file: in Design → More (mockup).</div>`);
}
function designSheet(){
  const b = document.body.dataset, opt = (lab, key, vals) => `<div class="opt"><div class="lab">${lab}</div><div class="seg">${vals.map(([v, l]) =>
    `<button type="button" data-set="${key}" data-val="${v}" aria-pressed="${(key === 'first' ? first : b[key]) === v}">${l}</button>`).join('')}</div></div>`;
  sheet(`<h3>Design</h3><p>Try the options; tell the session which to keep.</p>
    ${opt('Look', 'look', [['hearth', 'Hearth'], ['night', 'Night'], ['garden', 'Garden']])}
    ${opt('Density', 'density', [['comfy', 'Roomy'], ['compact', 'Compact']])}
    ${opt('Headings', 'heads', [['sans', 'Sans'], ['serif', 'Serif']])}
    ${opt('First screen', 'first', [['due', 'Due'], ['spaces', 'Spaces']])}`);
}

document.addEventListener('click', e => {
  const el = e.target.closest('button,a,[data-scrim],[data-thing]');
  if (!el) return;
  if (el.matches('a')) e.preventDefault();
  const d = el.dataset;
  if ('scrim' in d && e.target === el) return close();
  if ('done' in d) { e.stopPropagation(); el.classList.add('did'); el.textContent = '✓ Done'; return toast('Marked done today (mockup)'); }
  if ('set' in d) {
    if (d.set === 'first') { first = d.val; tab(first); } else document.body.dataset[d.set] = d.val;
    return designSheet();
  }
  if ('mock' in d) { close(); return toast(d.mock); }
  if ('design' in d) return designSheet();
  if ('back' in d) return back();
  if ('tab' in d) return tab(d.tab);
  if ('space' in d) return go({ space: d.space });
  if ('thing' in d) return go({ thing: d.thing });
  if ('art' in d) return go({ art: d.art });
  if (el.id === 'fab') return addSheet();
});
render();
</script>
</body>
</html>
